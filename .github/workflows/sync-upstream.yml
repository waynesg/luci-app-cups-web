name: Sync upstream cups-web

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-cups-web
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/hanxi/cups-web/releases/latest --jq '.tag_name')"
          version="${tag#v}"
          test -n "${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: hanxi/cups-web
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream

      - name: Allow LuCI embedding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('upstream/internal/middleware/security.go')
          text = path.read_text()
          text = text.replace('"frame-ancestors \'none\'"', '"frame-ancestors *"')
          text = text.replace('\n\t\th.Set("X-Frame-Options", "DENY")', '')
          if "frame-ancestors 'none'" in text or 'X-Frame-Options' in text:
              raise SystemExit('failed to patch upstream frame policy')
          path.write_text(text)
          PY

      - name: Enable OpenWrt embedded mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          csrf = Path('upstream/internal/middleware/csrf.go')
          text = csrf.read_text()
          text = text.replace('"net/http"', '"net/http"\n\t"os"')
          text = text.replace('func RequireSession(next http.Handler) http.Handler {', 'func embeddedMode() bool { return os.Getenv("CUPS_WEB_EMBEDDED") == "1" }\n\nfunc RequireSession(next http.Handler) http.Handler {')
          text = text.replace('\t\t_, err := auth.GetSession(r)', '\t\tif embeddedMode() { next.ServeHTTP(w, r); return }\n\t\t_, err := auth.GetSession(r)', 1)
          marker = 'func RequireAdmin(next http.Handler) http.Handler {\n\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {'
          text = text.replace(marker, marker + '\n\t\tif embeddedMode() { next.ServeHTTP(w, r); return }')
          text = text.replace('\t\t// Only validate for state-changing methods', '\t\tif embeddedMode() { next.ServeHTTP(w, r); return }\n\t\t// Only validate for state-changing methods')
          for expected in ('func embeddedMode()', 'if embeddedMode() { next.ServeHTTP(w, r); return }'):
              if expected not in text: raise SystemExit('failed to patch authentication middleware')
          csrf.write_text(text)

          auth = Path('upstream/cmd/server/auth_handlers.go')
          text = auth.read_text()
          text = text.replace('"net/http"', '"net/http"\n\t"os"')
          text = text.replace('func SessionHandler(w http.ResponseWriter, r *http.Request) {', 'func SessionHandler(w http.ResponseWriter, r *http.Request) {\n\tif os.Getenv("CUPS_WEB_EMBEDDED") == "1" { writeJSON(w, map[string]string{"username":"embedded", "role":"admin"}); return }')
          if '"os"' not in text or 'CUPS_WEB_EMBEDDED' not in text: raise SystemExit('failed to patch session handler')
          auth.write_text(text)

          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('upstream/frontend/src/App.vue')
          text = path.read_text()
          text = text.replace('</script>', "\nwindow.addEventListener('message', (event) => {\n  if (!event.data || event.data.type !== 'cups-web-theme') return\n  const root = document.documentElement\n  if (event.data.primary) root.style.setProperty('--ui-primary', event.data.primary)\n  if (event.data.primarySoft) root.style.setProperty('--ui-primary-50', event.data.primarySoft)\n})\n</script>", 1)
          path.write_text(text)
          PY

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build OpenWrt binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOTOOLCHAIN: local
          VERSION: ${{ steps.upstream.outputs.version }}-openwrt
        run: |
          set -euo pipefail
          cd upstream/frontend
          bun install --frozen-lockfile
          bunx vite build
          cd ../..
          go build -C upstream -ldflags="-s -w -X main.Version=${VERSION}" -o ../cups-web-linux-amd64 ./cmd/server
          file cups-web-linux-amd64 | grep -q 'statically linked'

      - name: Publish OpenWrt binary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: openwrt-${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" cups-web-linux-amd64 --clobber
          else
            gh release create "${TAG}" cups-web-linux-amd64 \
              --title "CUPS Web ${{ steps.upstream.outputs.tag }} for OpenWrt" \
              --notes "OpenWrt x86-64 build with LuCI iframe support."
          fi

      - name: Update OpenWrt package
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          sha256="$(sha256sum cups-web-linux-amd64 | cut -d' ' -f1)"
          sed -i -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" cups-web/Makefile
          sed -i -E "s/^PKG_RELEASE:=.*/PKG_RELEASE:=2/" cups-web/Makefile
          sed -i -E "s/^PKG_HASH:=.*/PKG_HASH:=${sha256}/" cups-web/Makefile
          grep -qx "PKG_HASH:=${sha256}" cups-web/Makefile

      - name: Commit changes
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- cups-web/Makefile; then
            echo "Already synchronized with ${TAG}."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cups-web/Makefile
          git commit -m "chore: sync cups-web ${TAG}"
          git push
